name: Council Studio CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tauri-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build-and-compile:
    # self-hosted Linux (UBUNTU) runner in container
    runs-on: [self-hosted, linux, mainMerger]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upgrade system toolchain/packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt -y upgrade

      - name: Install required Linux deps for Tauri
        shell: bash
        run: |
          set -euo pipefail
          sudo apt -y install \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            curl \
            wget \
            file \
            libxdo-dev \
            libgdk-pixbuf-2.0-dev \
            libglib2.0-dev \
            xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install frontend dependencies
        run: npm ci

      # Fresh rebuild requirement
      - name: Clean all previous build artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules/.cache || true
          rm -rf dist build out .turbo .vite || true
          rm -rf src-tauri/target target || true
          cargo clean --manifest-path src-tauri/Cargo.toml || true

      - name: Type check
        run: npm run typecheck --if-present

      - name: Lint
        run: npm run lint --if-present

      - name: Frontend tests
        run: npm test --if-present -- --runInBand

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Rust clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --all-features --locked

      - name: Build web assets
        run: npm run build

      - name: Compile Tauri executables (fresh)
        run: npm run tauri build

      - name: Upload Tauri artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-bundles-linux
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/release/*.deb
            src-tauri/target/release/*.AppImage
          if-no-files-found: warn